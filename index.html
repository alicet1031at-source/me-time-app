<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me Time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #F9F6F0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .morandi-card {
            background-color: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }
        /* 自訂選取框樣式 */
        .radio-custom:checked + div {
            border-color: #57534e;
            background-color: #f5f5f4;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4">

    <div class="w-full max-w-md morandi-card p-6 flex flex-col min-h-[85vh] relative overflow-hidden">
        
        <div id="page1" class="space-y-6">
            <div class="flex justify-between items-center border-b pb-4 border-stone-200">
                <h1 class="text-2xl font-bold text-stone-800 tracking-wide">Me Time</h1>
                <span class="text-xs text-stone-500 bg-stone-100 px-3 py-1 rounded-full font-medium currentDate"></span>
            </div>

            <div id="notificationBanner" class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-800 flex justify-between items-center hidden">
                <span>允許網頁通知，手機後台計時才會響喔！</span>
                <button onclick="requestNotificationPermission()" class="bg-amber-600 text-white px-3 py-1 rounded-lg font-bold">開啟</button>
            </div>

            <div class="space-y-4">
                <h3 class="text-base font-bold text-stone-700 flex items-center gap-2">1. 今日身心狀態</h3>
                <div class="bg-stone-50 p-3 rounded-xl flex justify-between items-center">
                    <span class="text-sm text-stone-600 font-medium">壓力值 (請點擊)</span>
                    <div class="flex gap-1 text-xl cursor-pointer text-stone-300" id="stressStars">
                        <span onclick="setStress(1)">★</span><span onclick="setStress(2)">★</span><span onclick="setStress(3)">★</span><span onclick="setStress(4)">★</span><span onclick="setStress(5)">★</span>
                    </div>
                </div>
                <div class="bg-stone-50 p-3 rounded-xl space-y-2">
                    <div class="flex justify-between items-center text-sm text-stone-600 font-medium">
                        <span>今日體力電量</span>
                        <span id="batteryVal" class="text-amber-600 font-bold">37%</span>
                    </div>
                    <input type="range" min="0" max="100" value="37" class="w-full accent-amber-500 h-1 bg-stone-200 rounded-lg appearance-none cursor-pointer" oninput="updateBattery(this.value)">
                </div>

                <div class="space-y-2">
                    <span class="text-sm text-stone-600 font-medium block">今日心情 (可複選)</span>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <button onclick="toggleMood(this)" class="py-2 rounded-xl border-2 border-stone-200 text-stone-600 hover:bg-stone-50 font-bold transition-all">🙂 正常</button>
                        <button onclick="toggleMood(this)" class="py-2 rounded-xl border-2 border-stone-200 text-stone-600 hover:bg-stone-50 font-bold transition-all">🥳 開心</button>
                        <button onclick="toggleMood(this)" class="py-2 rounded-xl border-2 border-stone-200 text-stone-600 hover:bg-stone-50 font-bold transition-all">😢 難過</button>
                        <button onclick="toggleMood(this)" class="py-2 rounded-xl border-2 border-stone-200 text-stone-600 hover:bg-stone-50 font-bold transition-all">😞 失望</button>
                        <button onclick="toggleMood(this)" class="py-2 rounded-xl border-2 border-stone-200 text-stone-600 hover:bg-stone-50 font-bold transition-all">🤯 煩躁</button>
                        <input type="text" placeholder="✏️ 其他..." class="p-2 rounded-xl border-2 border-stone-200 text-stone-600 text-center bg-transparent focus:outline-none focus:border-stone-400 font-bold">
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <h3 class="text-base font-bold text-stone-700">2. 今日讀書任務</h3>
                <div class="bg-stone-50 p-3 rounded-xl">
                    <input type="text" placeholder="讀書" class="w-full bg-transparent border-b border-stone-200 focus:outline-none text-sm pb-1 text-stone-700">
                    <input type="text" placeholder="✍️ 02" class="w-full bg-transparent border-b border-stone-200 focus:outline-none text-sm pb-1 text-stone-700 mt-2">
                </div>
            </div>

            <div class="space-y-2">
                <h3 class="text-base font-bold text-stone-700">3. 充電時間預約</h3>
                <div class="bg-stone-50 p-3 rounded-xl flex items-center gap-2">
                    <input type="number" id="chargeMinutes" value="1" class="w-20 p-2 rounded-lg border border-stone-200 bg-white text-center font-bold text-stone-700 focus:outline-none">
                    <span class="text-sm font-medium text-stone-600">分鐘</span>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-base font-bold text-stone-700">4. 應援點單 (可複選)</h3>
                <div class="space-y-2 text-sm text-stone-600">
                    <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-stone-50 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 accent-red-500"> <span>🔴 請勿打擾</span>
                    </label>
                    <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-stone-50 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 accent-amber-500"> <span>🟡 食物補給</span>
                    </label>
                    <div class="p-2 rounded-lg bg-stone-50 space-y-2">
                        <label class="flex items-center gap-3 cursor-pointer font-medium">
                            <input type="checkbox" checked class="w-4 h-4 accent-green-600"> <span>🟢 精神應援</span>
                        </label>
                        <div class="pl-7 space-y-1 text-xs text-stone-500">
                            <label class="flex items-center gap-2 py-1 cursor-pointer"><input type="checkbox" checked class="accent-blue-500"> 需要鼓勵 (單純幫我加油就好~)</label>
                            <label class="flex items-center gap-2 py-1 cursor-pointer"><input type="checkbox"> 我想聊聊 (今晚想找你們說說話)</label>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 p-2 rounded-lg">
                        <span class="text-stone-500 text-xs shrink-0">🔵 其他：</span>
                        <input type="text" placeholder="自由輸入欄位..." class="w-full bg-transparent border-b border-stone-200 focus:outline-none text-xs pb-0.5">
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <span class="text-xs font-semibold text-stone-400 block tracking-wider">MEMO</span>
                <textarea placeholder="寫下今天想記下來的事..." class="w-full h-16 p-3 rounded-xl border border-stone-200 text-xs bg-stone-50/30 focus:outline-none resize-none"></textarea>
            </div>

            <button onclick="submitApplication()" class="w-full py-4 bg-stone-800 text-white rounded-xl font-bold tracking-widest text-sm shadow-md hover:bg-stone-700 transition cursor-pointer mt-4">
                確認送出，開始 Me Time →
            </button>
        </div>
        
        <div id="page2" class="space-y-6 hidden py-6 flex-grow flex flex-col justify-center">
            <div class="text-center space-y-2" id="page2Header">
                <h1 class="text-xl font-bold text-stone-800 tracking-wide">⚡ 純充電模式</h1>
                <p class="text-xs text-stone-400 font-medium">這是完全屬於你的自由調適時間</p>
            </div>

            <div class="flex justify-center items-center py-4">
                <div class="w-52 h-52 rounded-full border-4 border-stone-100 bg-stone-50 flex flex-col justify-center items-center shadow-inner relative">
                    <span id="timerDisplay" class="text-5xl font-light text-stone-800 tracking-tighter">01:00</span>
                    <span id="timerSubText" class="text-[10px] text-stone-400 font-bold mt-2 tracking-widest uppercase">Me Time Counting</span>
                </div>
            </div>

            <div class="text-center">
                <p class="text-xs text-stone-500 font-medium italic">「充電後，我會更有動力！」</p>
            </div>

            <div id="postTimerActions" class="hidden space-y-3 mt-4">
                <button onclick="switchToPomodoro()" class="w-full py-3 bg-[#eefdf4] text-[#166534] border border-[#bbf7d0] rounded-xl font-bold text-sm shadow-sm hover:bg-[#dcfce7] transition flex justify-center items-center gap-2">
                    <span class="text-lg">🔋</span> 充飽電了！主動切換至「正向自律番茄鐘」
                </button>
                <button onclick="goToSleepReview()" class="w-full py-3 bg-stone-800 text-white rounded-xl font-bold text-sm shadow-md hover:bg-stone-700 transition">
                    進入睡前檢視 →
                </button>
            </div>

            <div id="pomodoroControls" class="bg-white p-4 rounded-2xl border border-stone-200 hidden space-y-4 shadow-sm mt-4">
                <span class="text-xs font-bold text-stone-600 block text-center flex items-center justify-center gap-1">🎯 自主設定讀書時間 <span class="text-stone-400 font-normal">(可重複無限續航)</span></span>
                <div class="flex gap-2 justify-center items-center">
                    <input type="number" id="pomoInput" value="25" class="w-16 p-2 border border-stone-200 rounded-xl text-center font-bold text-stone-700 focus:outline-none focus:border-stone-400">
                    <span class="text-xs text-stone-500 font-medium">分鐘</span>
                    <button onclick="startPomodoro()" class="bg-[#10b981] text-white px-4 py-2 rounded-xl font-bold text-sm shadow-sm hover:bg-[#059669] transition">啟動專注番茄鐘</button>
                </div>
            </div>
            
            <div id="pomodoroToSleepAction" class="hidden mt-4">
                 <button onclick="goToSleepReview()" class="w-full py-3 bg-stone-800 text-white rounded-xl font-bold text-sm shadow-md hover:bg-stone-700 transition">
                    進入睡前檢視 →
                </button>
            </div>
        </div>

        <div id="page3" class="space-y-6 hidden py-6">
            <div class="flex justify-between items-center border-b pb-4 border-stone-200">
                <h1 class="text-xl font-bold text-stone-800 tracking-wide">5. 睡前檢視</h1>
                <span class="text-xs text-stone-500 bg-stone-100 px-3 py-1 rounded-full font-medium currentDate"></span>
            </div>

            <div class="space-y-6">
                <div class="space-y-2">
                    <h3 class="text-sm font-bold text-stone-700 flex items-center gap-2">● 今日讀書任務確認</h3>
                    
                    <label class="block relative cursor-pointer">
                        <input type="radio" name="reviewStatus" class="peer sr-only radio-custom">
                        <div class="p-4 rounded-xl border-2 border-stone-200 hover:bg-stone-50 transition">
                            <div class="flex items-center gap-2 mb-1">
                                <input type="radio" name="reviewStatus_mock" checked class="w-4 h-4 accent-blue-600 pointer-events-none">
                                <span class="font-bold text-stone-700 text-sm">按照計畫執行</span>
                            </div>
                            <p class="text-xs text-stone-500 pl-6">我今天充電後，有順利去執行自派的讀書任務。</p>
                        </div>
                    </label>

                    <label class="block relative cursor-pointer">
                        <input type="radio" name="reviewStatus" class="peer sr-only radio-custom">
                        <div class="p-4 rounded-xl border-2 border-stone-200 hover:bg-stone-50 transition">
                            <div class="flex items-center gap-2 mb-1">
                                <input type="radio" name="reviewStatus_mock" class="w-4 h-4 accent-blue-600 pointer-events-none">
                                <span class="font-bold text-stone-700 text-sm flex items-center gap-1"><span class="text-blue-300">💤</span> 休息</span>
                            </div>
                            <p class="text-xs text-stone-500 pl-6">我決定今天先睡覺修復，明天再加油。</p>
                        </div>
                    </label>
                </div>

                <div class="space-y-2">
                    <h3 class="text-sm font-bold text-stone-700 flex items-center gap-2">● 自由書寫空間</h3>
                    <textarea placeholder="寫下今晚的心情反思、或者跟自己對話..." class="w-full h-32 p-3 rounded-xl border border-stone-200 text-sm bg-stone-50 focus:outline-none resize-none"></textarea>
                </div>
            </div>

            <button onclick="saveData()" class="w-full py-4 bg-stone-800 text-white rounded-xl font-bold tracking-widest text-sm shadow-md hover:bg-stone-700 transition cursor-pointer mt-8">
                儲存大腦能量 management 檔案 ✔
            </button>
        </div>

    </div>

    <script>
        let localTimer = null;
        let swRegistration = null;

        // 1. 設定當前日期
        const today = new Date();
        const dateString = `DATE: ${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
        document.querySelectorAll('.currentDate').forEach(el => el.innerText = dateString);

        // 2. Service Worker 註冊與通知權限
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                swRegistration = reg;
                if (Notification.permission === 'default') {
                    document.getElementById('notificationBanner').classList.remove('hidden');
                }
            }).catch(err => console.log('SW 註冊失敗', err));

            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data.type === 'TIMER_DONE') {
                    alert(event.data.message || '時間到囉！');
                }
            });
        }

        function requestNotificationPermission() {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    document.getElementById('notificationBanner').classList.add('hidden');
                }
            });
        }

        // 3. UI 互動功能
        function updateBattery(val) {
            document.getElementById('batteryVal').innerText = val + '%';
        }

        function setStress(level) {
            const stars = document.getElementById('stressStars').children;
            for (let i = 0; i < stars.length; i++) {
                stars[i].style.color = i < level ? '#fbbf24' : '#d6d3d1';
            }
        }

        // 心情按鈕變色邏輯
        function toggleMood(btn) {
            btn.classList.toggle('border-amber-400');
            btn.classList.toggle('bg-amber-50');
            btn.classList.toggle('text-amber-700');
            btn.classList.toggle('border-stone-200');
        }

        // 4. 開始第一階段：充電計時
        function submitApplication() {
            const minutes = parseInt(document.getElementById('chargeMinutes').value) || 1;
            
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
            
            document.getElementById('page2Header').classList.remove('hidden');
            document.getElementById('postTimerActions').classList.add('hidden');
            document.getElementById('pomodoroControls').classList.add('hidden');
            document.getElementById('pomodoroToSleepAction').classList.add('hidden');
            
            document.getElementById('timerSubText').innerText = "ME TIME COUNTING";
            document.getElementById('timerSubText').classList.replace('text-green-600', 'text-stone-400');

            startTimer(minutes, "Me Time 充電時間已完成！", showPostTimerActions);
        }

        // 5. 核心計時邏輯 (結合前端倒數與 Service Worker)
        function startTimer(minutes, alertMessage, onComplete) {
            clearInterval(localTimer);
            let secondsLeft = minutes * 60;
            const display = document.getElementById('timerDisplay');
            
            // 呼叫 Service Worker 進行背景計時
            if (swRegistration && swRegistration.active) {
                const endTime = Date.now() + secondsLeft * 1000;
                swRegistration.active.postMessage({ 
                    type: 'START_TIMER', 
                    endTime: endTime,
                    message: alertMessage
                });
            }

            updateTimerDisplay(secondsLeft, display);
            
            localTimer = setInterval(() => {
                secondsLeft--;
                updateTimerDisplay(secondsLeft, display);

                if (secondsLeft <= 0) {
                    clearInterval(localTimer);
                    setTimeout(() => {
                        alert(alertMessage);
                        if(onComplete) onComplete();
                    }, 100);
                }
            }, 1000);
        }

        function updateTimerDisplay(seconds, displayElement) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            displayElement.innerText = `${m}:${s}`;
        }

        // 6. 充電結束後的狀態變更
        function showPostTimerActions() {
            document.getElementById('timerSubText').innerText = "🔋 充電已完成！";
            document.getElementById('timerSubText').classList.replace('text-stone-400', 'text-green-600');
            document.getElementById('postTimerActions').classList.remove('hidden');
        }

        // 7. 切換至番茄鐘模式
        function switchToPomodoro() {
            document.getElementById('page2Header').classList.add('hidden');
            document.getElementById('postTimerActions').classList.add('hidden');
            
            document.getElementById('timerDisplay').innerText = "25:00";
            document.getElementById('timerSubText').innerText = "FOCUSING";
            document.getElementById('timerSubText').classList.replace('text-green-600', 'text-stone-400');
            
            document.getElementById('pomodoroControls').classList.remove('hidden');
            document.getElementById('pomodoroToSleepAction').classList.remove('hidden');
        }

        // 8. 啟動番茄鐘計時
        function startPomodoro() {
            const minutes = parseInt(document.getElementById('pomoInput').value) || 25;
            startTimer(minutes, "專注時間結束！辛苦了！", () => {
                document.getElementById('timerSubText').innerText = "FOCUS COMPLETE";
            });
        }

        // 9. 進入睡前檢視頁面
        function goToSleepReview() {
            clearInterval(localTimer);
            if (swRegistration && swRegistration.active) {
                swRegistration.active.postMessage({ type: 'CANCEL_TIMER' });
            }

            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.remove('hidden');
            
            // 處理自訂 Radio 按鈕的視覺
            const radios = document.querySelectorAll('input[name="reviewStatus"]');
            const mockRadios = document.querySelectorAll('input[name="reviewStatus_mock"]');
            radios.forEach((radio, index) => {
                radio.addEventListener('change', () => {
                    mockRadios.forEach(m => m.checked = false);
                    mockRadios[index].checked = true;
                });
            });
        }

        // 10. 最終儲存
        function saveData() {
            alert("今天的能量管理檔案已儲存！辛苦了！");
            window.location.reload(); 
        }
    </script>
</body>
</html>
