<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me Time</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #F9F6F0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .morandi-card {
            background-color: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }
        .task-btn-complete.selected {
            background-color: #dcfce7;
            border-color: #16a34a;
            color: #15803d;
            font-weight: 700;
        }
        .task-btn-incomplete.selected {
            background-color: #fee2e2;
            border-color: #dc2626;
            color: #b91c1c;
            font-weight: 700;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-4">

    <div class="w-full max-w-md morandi-card p-6 flex flex-col justify-between min-h-[85vh] relative overflow-hidden">
        
        <div id="page1" class="space-y-6">
            <div class="flex justify-between items-center border-b pb-4 border-stone-200">
                <h1 class="text-2xl font-bold text-stone-800 tracking-wide">Me Time</h1>
                <span class="text-xs text-stone-500 bg-stone-100 px-3 py-1 rounded-full font-medium" id="currentDate1"></span>
            </div>

            <div id="notificationBanner" class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-800 flex justify-between items-center hidden">
                <span>允許網頁通知，手機後台計時才會響喔！</span>
                <button onclick="requestNotificationPermission()" class="bg-amber-600 text-white px-3 py-1 rounded-lg font-bold">開啟</button>
            </div>

            <div class="space-y-4">
                <h3 class="text-base font-bold text-stone-700 flex items-center gap-2">1. 今日身心狀態</h3>
                <div class="bg-stone-50 p-3 rounded-xl flex justify-between items-center">
                    <span class="text-sm text-stone-600 font-medium">壓力值</span>
                    <div class="flex gap-1 text-xl cursor-pointer text-stone-300" id="stressStars">
                        <span onclick="setStress(1)">★</span><span onclick="setStress(2)">★</span><span onclick="setStress(3)">★</span><span onclick="setStress(4)">★</span><span onclick="setStress(5)">★</span>
                    </div>
                </div>
                <div class="bg-stone-50 p-3 rounded-xl space-y-2">
                    <div class="flex justify-between items-center text-sm text-stone-600 font-medium">
                        <span>今日體力電量</span>
                        <span id="batteryVal" class="text-amber-600 font-bold">50%</span>
                    </div>
                    <input type="range" min="0" max="100" value="50" class="w-full accent-amber-500 h-1 bg-stone-200 rounded-lg appearance-none cursor-pointer" oninput="updateBattery(this.value)">
                </div>
            </div>

            <div class="space-y-2">
                <h3 class="text-base font-bold text-stone-700">2. 充電時間預約</h3>
                <div class="bg-stone-50 p-3 rounded-xl">
                    <div class="flex items-center gap-2">
                        <input type="number" id="chargeMinutes" value="25" class="w-20 p-2 rounded-lg border border-stone-200 bg-white text-center font-bold text-stone-700 focus:outline-none">
                        <span class="text-sm font-medium text-stone-600">分鐘</span>
                    </div>
                </div>
            </div>

            <button onclick="submitApplication()" class="w-full py-4 bg-stone-800 text-white rounded-xl font-bold tracking-widest text-sm shadow-md hover:bg-stone-700 transition cursor-pointer mt-4">
                確認送出，開始 Me Time →
            </button>
        </div>
        
        <div id="page2" class="space-y-8 hidden py-6">
            <div class="text-center space-y-2">
                <h1 class="text-xl font-bold text-stone-800 tracking-wide">⚡ 純充電模式</h1>
                <p class="text-xs text-stone-400 font-medium">這是完全屬於你的自由調適時間</p>
            </div>

            <div class="flex justify-center items-center py-4">
                <div class="w-52 h-52 rounded-full border-4 border-stone-100 bg-stone-50/50 flex flex-col justify-center items-center shadow-inner">
                    <span class="text-5xl">🔋</span>
                    <span id="timerDisplay" class="text-4xl font-light text-stone-800 tracking-tighter">25:00</span>
                </div>
            </div>

            <div class="flex gap-2 justify-center items-center">
                <button onclick="cancelTimer()" class="bg-stone-200 text-stone-600 px-6 py-3 rounded-xl font-bold text-sm w-full">提前結束</button>
            </div>
        </div>

    </div>

    <script>
        let swRegistration = null;
        let localTimer = null;

        // 1. 取得當前日期
        const today = new Date();
        document.getElementById('currentDate1').innerText = `DATE: ${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()}`;

        // 2. 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                swRegistration = reg;
                console.log('Service Worker 註冊成功');
                checkNotificationStatus();
            }).catch(err => console.log('SW 註冊失敗', err));

            // 監聽來自 Service Worker 的「時間到」訊息
            navigator.serviceWorker.addEventListener('message', event => {
                if (event.data.type === 'TIMER_DONE') {
                    alert('Me Time 結束囉！你做得很好！');
                    cancelTimer(); // 切換回首頁
                }
            });
        }

        // 3. UI 互動功能
        function updateBattery(val) {
            document.getElementById('batteryVal').innerText = val + '%';
        }

        function setStress(level) {
            const stars = document.getElementById('stressStars').children;
            for (let i = 0; i < stars.length; i++) {
                stars[i].style.color = i < level ? '#fbbf24' : '#d6d3d1';
            }
        }

        // 4. 通知權限處理
        function checkNotificationStatus() {
            if (Notification.permission === 'default') {
                document.getElementById('notificationBanner').classList.remove('hidden');
            }
        }

        function requestNotificationPermission() {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    document.getElementById('notificationBanner').classList.add('hidden');
                }
            });
        }

        // 5. 送出並開始計時 (最核心的串接點)
        function submitApplication() {
            const minutes = parseInt(document.getElementById('chargeMinutes').value) || 25;
            
            // 畫面切換
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');

            // 呼叫 Service Worker 開始背景計時
            if (swRegistration && swRegistration.active) {
                const endTime = Date.now() + minutes * 60 * 1000;
                swRegistration.active.postMessage({ type: 'START_TIMER', endTime: endTime });
            }

            // 同步啟動前端畫面倒數
            startLocalTimer(minutes * 60);
        }

        function startLocalTimer(totalSeconds) {
            clearInterval(localTimer);
            let secondsLeft = totalSeconds;
            
            const display = document.getElementById('timerDisplay');
            
            localTimer = setInterval(() => {
                secondsLeft--;
                const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
                const s = (secondsLeft % 60).toString().padStart(2, '0');
                display.innerText = `${m}:${s}`;

                if (secondsLeft <= 0) {
                    clearInterval(localTimer);
                }
            }, 1000);
        }

        // 6. 取消計時與重置
        function cancelTimer() {
            clearInterval(localTimer);
            
            // 呼叫 Service Worker 取消背景計時
            if (swRegistration && swRegistration.active) {
                swRegistration.active.postMessage({ type: 'CANCEL_TIMER' });
            }

            // 切換回首頁
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page1').classList.remove('hidden');
        }
    </script>
</body>
</html>
